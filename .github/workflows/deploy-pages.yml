name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knowledge-site/package-lock.json

      - name: Install Quartz dependencies
        working-directory: knowledge-site
        run: npm ci

      # build-site.mjs가 내부적으로 quartz plugin install + quartz build를 실행하고,
      # 결과를 기존 포트폴리오 정적 파일과 함께 dist/ 로 합친다.
      - name: Build integrated site
        run: node scripts/build-site.mjs

      # 민감정보/깨진 링크/필수파일 검사. 실패하면 여기서 멈추고 배포 job으로 안 넘어감.
      - name: Verify public content
        run: node scripts/verify-public-content.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
