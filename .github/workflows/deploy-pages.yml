name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knowledge-site/package-lock.json

      - name: Install Quartz dependencies
        working-directory: knowledge-site
        run: npm ci

      # npx가 만드는 node_modules/.bin/quartz 심링크가 실행권한 문제로 가끔
      # "Permission denied"를 내서, bootstrap-cli.mjs를 node로 직접 호출한다.
      - name: Install Quartz plugins
        working-directory: knowledge-site
        run: node quartz/bootstrap-cli.mjs plugin install --from-config

      - name: Build site
        working-directory: knowledge-site
        run: node quartz/bootstrap-cli.mjs build

      # 민감정보/깨진 링크/필수파일 검사. 실패하면 여기서 멈추고 배포 job으로 안 넘어감.
      - name: Verify public content
        run: node scripts/verify-public-content.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: knowledge-site/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
